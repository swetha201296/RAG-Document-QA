<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>History - InsightRAG</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .history-card {
            margin-top: 30px;
            background: #171b24;
            border: 1px solid #303642;
            border-radius: 15px;
            overflow: hidden;
        }

        .history-header {
            padding: 22px 25px;
            border-bottom: 1px solid #303642;
        }

        .history-header h2 {
            margin: 0;
        }

        .history-header p {
            color: #8d97a8;
            margin-top: 7px;
        }

        .history-item {
            padding: 20px 25px;
            border-bottom: 1px solid #252a34;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .question-text {
            color: #e6e9ef;
            font-size: 15px;
        }

        .question-time {
            color: #737d8e;
            font-size: 12px;
            margin-top: 7px;
        }

        .history-status {
            background: #123c32;
            color: #20c997;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            white-space: nowrap;
        }

        .empty-history {
            padding: 40px 25px;
            text-align: center;
            color: #8d97a8;
        }

    </style>

</head>


<body>

<script>
    if (localStorage.getItem("darkMode") === "false") {
        document.body.classList.add("light-theme");
    }
</script>
<div class="app">

    <aside class="sidebar">

        <div class="logo">

            <div class="logo-icon">R</div>

            <h2>InsightRAG</h2>

        </div>


        <nav class="sidebar-nav">

            <a class="nav-item" href="dashboard.html">
                ⌂ <span>Dashboard</span>
            </a>

            <a class="nav-item" href="documents.html">
                ▣ <span>Documents</span>
            </a>

            <a class="nav-item" href="chat.html">
                ○ <span>Chat</span>
            </a>

            <a class="nav-item active" href="history.html">
                ◷ <span>History</span>
            </a>

            <a class="nav-item" href="analytical.html">
                ◇ <span>Analytical</span>
            </a>

            <a class="nav-item" href="profile.html">
                ● <span>Profile</span>
            </a>

            <a class="nav-item" href="settings.html">
                ⚙ <span>Settings</span>
            </a>

        </nav>


        <div class="profile">

            <div class="profile-icon">V</div>

            <div>
                <strong>Vijay</strong>
                <small>vijay@insightrag.ai</small>
            </div>

        </div>

    </aside>


    <main class="main-content">

        <h1>History</h1>

        <p style="color:#8d97a8; margin-top:8px;">
            View your previous questions and answers.
        </p>


        <div class="history-card">

            <div class="history-header">

                <h2>Question History</h2>

                <p id="historyCount">
                    0 questions
                </p>

            </div>


            <div id="historyList">

            </div>

        </div>

    </main>

</div>


<script>

    const historyList =
        document.getElementById("historyList");

    const historyCount =
        document.getElementById("historyCount");


    const analyticsData =
        JSON.parse(
            localStorage.getItem("analyticsData") || "[]"
        );


    if (analyticsData.length === 0) {

        historyCount.innerText =
            "0 questions";

        historyList.innerHTML = `
            <div class="empty-history">
                No questions asked yet.
            </div>
        `;

    } else {

        historyCount.innerText =
            analyticsData.length +
            (analyticsData.length === 1
                ? " question"
                : " questions");


        // Latest question first
        const reversedData =
            [...analyticsData].reverse();


        reversedData.forEach(item => {

            const date =
                item.date
                    ? new Date(item.date).toLocaleString()
                    : "Unknown time";


            const row =
                document.createElement("div");

            row.className =
                "history-item";


            row.innerHTML = `

                <div>

                    <div class="question-text">
                        ${escapeHtml(item.question)}
                    </div>

                    <div class="question-time">
                        ${escapeHtml(item.document || "Uploaded Document")}
                        • ${date}
                        • ${item.responseTime || 0}ms
                    </div>

                </div>

                <span class="history-status">
                    ${item.success ? "Completed" : "Failed"}
                </span>

            `;


            historyList.appendChild(row);

        });

    }


    function escapeHtml(text) {

        const div =
            document.createElement("div");

        div.textContent =
            text || "";

        return div.innerHTML;

    }

</script>


</body>

</html>
